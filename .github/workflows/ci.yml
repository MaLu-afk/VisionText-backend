name: CI

# No corre en push ni en PR: los push solo suben código.
# Lo ejecuta deploy.yml al publicar un tag, para que nunca se despliegue un commit
# que no pase estas verificaciones. También se puede lanzar a mano desde Actions.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Se construye la misma imagen que construirá Railway: si falla aquí, fallaría allí
      - name: Construir imagen Docker
        run: docker build -t visiontext-backend:ci .

      - name: Ejecutar tests dentro de la imagen
        run: |
          docker run --rm -v "$PWD:/app" -w /app visiontext-backend:ci \
            sh -c "pip install -q -r requirements-dev.txt && python -m pytest -q"
